<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تعذر الدفع | مكتبة البابا كيرلس</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="styles.min.css?v=asset-4c224e8382a7" />
    <style>
      body { min-height: 100vh; display: grid; place-items: center; background: #f7f3eb; }
      .payment-result { width: min(92vw, 680px); padding: 42px; border: 1px solid #ded4c1; border-radius: 18px; background: #fffaf1; box-shadow: 0 24px 60px rgba(18, 35, 47, .12); text-align: center; }
      .payment-result strong { display: inline-grid; place-items: center; width: 64px; height: 64px; margin-bottom: 18px; border-radius: 50%; background: #8e2441; color: #fff; font-size: 32px; }
      .payment-result h1 { margin: 0 0 12px; color: #12232f; font-size: clamp(30px, 5vw, 46px); }
      .payment-result p { color: #526674; font-size: 18px; line-height: 1.8; }
      .payment-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 24px; }
      .payment-actions a { text-decoration: none; }
    </style>
  </head>
  <body>
    <main class="payment-result">
      <strong>!</strong>
      <h1>تعذر إتمام الدفع</h1>
      <p>لم يتم تأكيد العملية من Paymob. يمكنك الرجوع للمتجر والمحاولة مرة أخرى أو التواصل معنا للمساعدة.</p>
      <div class="payment-actions">
        <a class="button primary" href="/">الرجوع للمتجر</a>
        <a class="button secondary" href="/#contact">تواصل معنا</a>
      </div>
    </main>
  </body>
</html>
